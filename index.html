<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 2. CONNECTION (Double-check these two strings!)
  const _URL = 'https://YOUR_PROJECT_URL.supabase.co'; 
  const _KEY = 'YOUR_LONG_ANON_PUBLIC_KEY';

  const supabase = supabase.createClient(_URL, _KEY);

  async function displayTradingItems() {
    const listArea = document.getElementById('inventory-list');
    
    try {
      const { data, error } = await supabase
        .from('trading_items')
        .select('*');

      if (error) {
        // This will print the EXACT error from Supabase on your screen
        listArea.innerHTML = `<p style="color:red;">Database Error: ${error.message}</p>`;
        return;
      }

      if (data.length === 0) {
        listArea.innerHTML = "<p>Table is connected, but no items found. Add a row in Supabase!</p>";
        return;
      }

      listArea.innerHTML = ""; 
      data.forEach(item => {
        const card = document.createElement('div');
        card.style = "border: 1px solid #D4AF37; margin: 10px; padding: 15px; border-radius: 8px; background: #1a1a1a;";
        card.innerHTML = `
          <h3 style="color:#D4AF37; margin:0;">${item.item_name}</h3>
          <p style="color:#ccc; font-size:0.9em;">Category: ${item.category}</p>
          <p style="font-size: 1.2em; color:#fff;">Price: $${item.price}</p>
          <span style="color:#D4AF37; font-weight:bold;">${item.status}</span>
        `;
        listArea.appendChild(card);
      });

    } catch (err) {
      listArea.innerHTML = `<p style="color:red;">System Error: ${err.message}</p>`;
    }
  }

  displayTradingItems();
</script>
