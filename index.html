<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Paste your exact URL and Key here
  const _URL = 'https://YOUR_PROJECT_ID.supabase.co'; 
  const _KEY = 'YOUR_ANON_KEY';

  // 2. Initialize connection
  const supabaseClient = supabase.createClient(_URL, _KEY);

  async function getItems() {
    const listArea = document.getElementById('inventory-list');
    
    // Test if the listArea exists first
    if (!listArea) {
       console.error("Missing inventory-list div in HTML");
       return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('trading_items')
        .select('*');

      if (error) {
        listArea.innerHTML = `<p style="color:red; background:white; padding:10px;">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        listArea.innerHTML = "<p style='color:white;'>Connected! But no items found in your Supabase table.</p>";
        return;
      }

      // Clear loading text and show cards
      listArea.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement('div');
        card.style = "border: 2px solid #D4AF37; margin-bottom: 15px; padding: 15px; background: #1a1a1a; color: white; border-radius: 10px;";
        card.innerHTML = `
          <h2 style="color:#D4AF37; margin:0;">${item.item_name || 'No Name'}</h2>
          <p>Category: ${item.category || 'General'}</p>
          <p style="font-size: 1.3em; font-weight: bold;">$${item.price || '0'}</p>
          <p style="color:#D4AF37;">Status: ${item.status || 'Available'}</p>
        `;
        listArea.appendChild(card);
      });

    } catch (err) {
      listArea.innerHTML = `<p style="color:red; background:white;">Critical Error: ${err.message}</p>`;
    }
  }

  // Start the engine
  window.onload = getItems;
</script>
