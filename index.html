<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Connect to the Database
  const supabaseUrl = 'YOUR_SUPABASE_URL'
  const supabaseKey = 'YOUR_SUPABASE_KEY'
  const supabase = supabase.createClient(supabaseUrl, supabaseKey)

  // 2. Fetch the data from your "trading_items" table
  async function loadInventory() {
    const { data, error } = await supabase
      .from('trading_items')
      .select('*')

    if (error) {
      console.error('Error loading data:', error)
      return
    }

    // 3. Show the data on the screen
    const display = document.getElementById('inventory-list')
    data.forEach(item => {
      const itemDiv = document.createElement('div')
      itemDiv.innerHTML = `<h3>${item.item_name}</h3><p>Category: ${item.category} | Price: $${item.price}</p>`
      display.appendChild(itemDiv)
    })
  }

  loadInventory()
</script>
