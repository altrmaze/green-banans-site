<!DOCTYPE html>
<html lang="en" id="app-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN BANANAS | Enterprise Brokerage</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1b4332; --accent: #2d6a4f; }
        body { font-family: 'Inter', sans-serif; background: #fdfdfd; }
        .font-ar { font-family: 'Cairo', sans-serif !important; }
        
        /* AI Chat Window Style */
        #ai-engine { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(120%); }
        #ai-engine.active { transform: translateY(0); }
        
        .glass-morphism { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(27, 67, 50, 0.1); }
        .secure-blur { filter: blur(10px); pointer-events: none; }
    </style>
</head>
<body class="antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-brand w-10 h-10 rounded-xl bg-[#1b4332] flex items-center justify-center shadow-lg">
                    <span class="text-white font-black">GB</span>
                </div>
                <h1 class="text-xl font-black tracking-tight text-slate-800">GREEN BANANAS <span class="text-gray-300 font-normal text-xs uppercase">Enterprise</span></h1>
            </div>
            
            <div class="flex items-center space-x-6">
                <select onchange="changeLang(this.value)" class="text-xs font-bold border-none bg-transparent outline-none cursor-pointer text-slate-500">
                    <option value="en">ENGLISH (US)</option>
                    <option value="ar">العربية (AR)</option>
                    <option value="fr">FRANÇAIS (FR)</option>
                </select>
                <button onclick="toggleAI()" class="text-[#1b4332] hover:scale-110 transition"><i class="fas fa-robot text-xl"></i></button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-12">
        <header class="mb-16">
            <h2 class="text-4xl font-black mb-2 tracking-tight" data-key="header-title">Global Sourcing Hub</h2>
            <p class="text-slate-400 font-medium" data-key="header-desc">Automated Brokerage for High-Value Assets.</p>
        </header>

        <div id="catalog-engine" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <div id="ai-engine" class="fixed bottom-6 right-6 w-80 md:w-96 glass-morphism rounded-3xl shadow-2xl z-[100] overflow-hidden">
        <div class="bg-[#1b4332] p-4 flex justify-between items-center text-white">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                <span class="text-xs font-bold uppercase tracking-widest">Smart Assistant Live</span>
            </div>
            <button onclick="toggleAI()"><i class="fas fa-times"></i></button>
        </div>
        <div id="chat-box" class="h-80 overflow-y-auto p-4 space-y-4 text-sm">
            <div class="bg-gray-100 p-3 rounded-2xl rounded-tl-none mr-10 text-slate-600">
                Welcome to Green Bananas. I am the Smart Engine. How can I assist your trade today?
            </div>
        </div>
        <div class="p-4 border-t flex space-x-2">
            <input type="text" id="ai-input" placeholder="Ask about an asset..." class="flex-1 bg-gray-50 border-none rounded-full px-4 py-2 text-sm outline-none focus:ring-1 ring-[#1b4332]">
            <button onclick="aiAsk()" class="bg-[#1b4332] text-white w-10 h-10 rounded-full"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const _URL = 'https://xlmgtjikvmagdtoksdfo.supabase.co';
        const _KEY = 'sb_publishable_DaKgyW1UYRZxkwaXIAM_Sw_sKDBrdX2';
        const supabase = supabase.createClient(_URL, _KEY);

        // Professional Translation Dictionary
        const i18n = {
            en: { "header-title": "Global Sourcing Hub", "header-desc": "Automated Brokerage for High-Value Assets.", "unlock": "REVEAL DATA ($20)", "comm": "Comm: 2%" },
            ar: { "header-title": "مركز التوريد العالمي", "header-desc": "وساطة آلية للأصول عالية القيمة.", "unlock": "كشف البيانات (20$)", "comm": "العمولة: 2%" },
            fr: { "header-title": "Centre d'Approvisionnement", "header-desc": "Courtage Automatisé pour Actifs.", "unlock": "RÉVÉLER ($20)", "comm": "Comm: 2%" }
        };

        // 1. DATA ENGINE (SQL Fetch)
        async function runEngine() {
            const container = document.getElementById('catalog-engine');
            const { data, error } = await supabase.from('trading_items').select('*');

            if (error) return;

            container.innerHTML = "";
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "group bg-white rounded-[2rem] p-8 border border-slate-100 shadow-sm hover:shadow-2xl transition-all duration-500";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-tighter">${item.category}</span>
                        <div class="text-[#1b4332] text-xs font-bold bg-green-50 px-3 py-1 rounded-full">${item.status}</div>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-800 mb-6 group-hover:text-[#1b4332] transition-colors">${item.item_name}</h3>
                    
                    <div class="relative bg-slate-50 rounded-2xl p-6 mb-8">
                        <div class="secure-blur text-[10px] text-slate-400 space-y-2">
                            <p>ORIGIN: [REDACTED]</p>
                            <p>CERTIFICATION: [REDACTED]</p>
                        </div>
                        <button class="absolute inset-0 m-auto bg-white border border-slate-200 text-slate-700 text-[10px] font-bold px-6 py-2 rounded-full shadow-sm hover:bg-[#1b4332] hover:text-white transition">
                            UNLOCK DETAILS ($20)
                        </button>
                    </div>

                    <div class="flex justify-between items-end border-t pt-6">
                        <div>
                            <p class="text-[10px] font-bold text-slate-300 uppercase">Asset Value</p>
                            <p class="text-2xl font-black text-slate-800">$${Number(item.price).toLocaleString()}</p>
                        </div>
                        <button class="bg-slate-900 text-white px-6 py-3 rounded-xl text-xs font-bold hover:bg-[#1b4332] transition">CONNECT</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 2. SMART AI ENGINE LOGIC
        function toggleAI() { document.getElementById('ai-engine').classList.toggle('active'); }

        function aiAsk() {
            const input = document.getElementById('ai-input');
            const box = document.getElementById('chat-box');
            if(!input.value) return;

            // User Message
            box.innerHTML += `<div class="bg-[#1b4332] text-white p-3 rounded-2xl rounded-tr-none ml-10 mb-4">${input.value}</div>`;
            
            // Smart Response Logic
            setTimeout(() => {
                let response = "I've analyzed your request. To protect this trade, please pay the $20 access fee to review the seller's qualifications.";
                if(input.value.toLowerCase().includes("car") || input.value.toLowerCase().includes("banana")) {
                    response = "We have high-grade assets matching that description. I can reveal the country of origin once the brokerage policy is signed.";
                }
                box.innerHTML += `<div class="bg-gray-100 p-3 rounded-2xl rounded-tl-none mr-10 text-slate-600 mb-4">${response}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 1000);

            input.value = "";
        }

        // 3. MULTI-LANGUAGE ENGINE
        function changeLang(code) {
            const html = document.getElementById('app-root');
            html.setAttribute('dir', code === 'ar' ? 'rtl' : 'ltr');
            if(code === 'ar') document.body.classList.add('font-ar');
            else document.body.classList.remove('font-ar');

            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                el.innerText = i18n[code][key];
            });
            runEngine(); // Reload cards
        }

        window.onload = runEngine;
    </script>
</body>
</html>
