<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN BANANAS | Enterprise Global Marketplace</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --gb-green: #1b4332; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fdfdfd; }
        .market-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .market-card:hover { transform: translateY(-8px); border-color: #1b4332; }
        .nav-blur { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = supabase.createClient('https://xlmgtjikvmagdtoksdfo.supabase.co', 'sb_publishable_DaKgyW1UYRZxkwaXIAM_Sw_sKDBrdX2');

        function App() {
            const [items, setItems] = useState([]);
            const [lang, setLang] = useState('en');

            const content = {
                en: { title: "Global Assets", sub: "Verified Corporate Marketplace", btn: "View Details", sell: "List Item" },
                ar: { title: "الأصول العالمية", sub: "سوق الشركات المعتمد", btn: "عرض التفاصيل", sell: "إدراج سلعة" }
            };

            useEffect(() => { 
                loadMarket();
            }, []);

            const loadMarket = async () => {
                const { data } = await supabase.from('trading_items').select('*');
                setItems(data || []);
            };

            return (
                <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className={lang === 'ar' ? 'font-serif' : ''}>
                    {/* Enterprise Nav */}
                    <nav className="nav-blur sticky top-0 z-50 border-b px-8 py-5 flex justify-between items-center">
                        <div className="flex items-center space-x-4">
                            <div className="bg-[#1b4332] text-white px-3 py-1 rounded font-black">GB</div>
                            <h1 className="text-xl font-black tracking-tighter text-slate-800">GREEN BANANAS</h1>
                        </div>
                        <div className="flex items-center space-x-6">
                            <select onChange={(e) => setLang(e.target.value)} className="text-xs font-bold border-none bg-transparent uppercase">
                                <option value="en">English</option>
                                <option value="ar">العربية</option>
                            </select>
                            <button className="bg-[#1b4332] text-white px-6 py-2 rounded-full text-xs font-bold shadow-lg">
                                {content[lang].sell}
                            </button>
                        </div>
                    </nav>

                    {/* Professional Header */}
                    <header className="py-20 text-center px-6 bg-slate-50">
                        <h2 className="text-5xl font-black text-slate-900 mb-4">{content[lang].title}</h2>
                        <p className="text-slate-400 font-medium uppercase tracking-widest text-xs">{content[lang].sub}</p>
                    </header>

                    {/* Product Floor */}
                    <main className="container mx-auto px-6 py-16">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {items.map(item => (
                                <div key={item.id} className="market-card bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-[10px] font-black text-[#1b4332] uppercase bg-green-50 px-2 py-1 rounded-md">{item.category}</span>
                                        <i className="fas fa-shield-check text-blue-500 text-xs"></i>
                                    </div>
                                    
                                    {/* Placeholder for Product Image */}
                                    <div className="h-48 bg-slate-50 rounded-2xl mb-6 flex items-center justify-center">
                                        <i className="fas fa-box-open text-slate-200 text-4xl"></i>
                                    </div>

                                    <h3 className="text-xl font-bold text-slate-800 mb-2">{item.item_name}</h3>
                                    <p className="text-xs text-slate-400 mb-8 line-clamp-2">High-quality industrial grade asset verified for global shipment.</p>

                                    <div className="mt-auto pt-6 border-t flex justify-between items-center">
                                        <span className="text-xs font-bold text-slate-500">Contact for Quote</span>
                                        <button className="text-[#1b4332] font-black text-xs uppercase tracking-wider hover:underline">
                                            {content[lang].btn}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* AI Support - Professional Placement */}
                    <div className="fixed bottom-8 right-8">
                        <button className="bg-[#1b4332] text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center">
                            <i className="fas fa-comment-alt"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
