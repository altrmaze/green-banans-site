  const supabase = supabase.createClient(_URL, _KEY);

  // 3. The Function to get your cars/products
  async function displayTradingItems() {
    const { data, error } = await supabase
      .from('trading_items')
      .select('*');

    const listArea = document.getElementById('inventory-list');

    if (error) {
      listArea.innerHTML = "<p style='color:red;'>Connection Error. Please check keys.</p>";
      return;
    }

    // 4. Clear the "Loading" text and show items
    listArea.innerHTML = ""; 
    data.forEach(item => {
      const card = document.createElement('div');
      card.style = "border: 1px solid #D4AF37; margin: 10px; padding: 15px; border-radius: 8px;";
      card.innerHTML = `
        <h3 style="color:#D4AF37;">${item.item_name}</h3>
        <p>Category: ${item.category} | Status: <strong>${item.status}</strong></p>
        <p style="font-size: 1.2em;">Price: $${item.price}</p>
      `;
      listArea.appendChild(card);
    });
  }

  // Run the function when the page opens
  displayTradingItems();
</script>
